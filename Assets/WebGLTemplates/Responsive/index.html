<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0820; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      /* Letterboxed 16:9 canvas that always fits the browser window. */
      #unity-canvas { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #120c2c; display: block; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; color: #f6e7c1;
                 font: 600 16px/1.4 system-ui, sans-serif; text-align: center; letter-spacing: 0.08em; }
      #bar { margin-top: 10px; height: 10px; border: 2px solid #f0a33a; border-radius: 6px; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #f7c948, #f0782a); }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="loading">LOADING JACKPOT...<div id="bar"><div id="fill"></div></div></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#loading").textContent = "Failed to load: " + message;
      });
    </script>
  </body>
</html>
